# Aperçu de la maquette sur GitHub Pages : https://agnissanv.github.io/site-hca-m-gnan/
# Prérequis (une seule fois) : Settings > Pages > Build and deployment > Source : « GitHub Actions ».
# La mise en ligne définitive se fera sur Cloudflare Pages (horizoncomptable.com).
name: Aperçu GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # npm install plutôt que npm ci : le package-lock.json généré sous Windows omet
      # @emnapi/core et @emnapi/runtime (dépendances des binaires WebAssembly), ce qui
      # fait échouer la vérification stricte de npm ci sous Linux.
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          SITE_URL: https://agnissanv.github.io
          BASE_PATH: /site-hca-m-gnan
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
